<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Arrange, listen to and share layered nature soundscapes.">
<title>WhiteNoiseChoir Studio</title>
<style>
:root{color-scheme:dark;font:15px "Instrument Sans",system-ui,sans-serif;background:#151b19;color:#f2f1e8;--panel:#202824;--line:#38443d;--accent:#d5e99c}*{box-sizing:border-box}body{margin:0}header,main{max-width:1320px;margin:auto;padding:22px clamp(16px,4vw,56px)}header{border-bottom:1px solid var(--line);font-weight:750;letter-spacing:-.04em}h1{font-size:clamp(34px,7vw,70px);font-weight:550;letter-spacing:-.07em;margin:8px 0 20px}button,input,select{font:inherit;color:inherit}button,select,input[type=number],input[type=text]{background:#27312b;border:1px solid var(--line);border-radius:8px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#1b2516;font-weight:750}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}label{display:inline-flex;gap:7px;align-items:center}input[type=number]{width:82px}input[type=range]{accent-color:var(--accent)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.shell{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;margin-top:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}aside h2{font-size:16px;margin:0 0 12px}aside .row{justify-content:space-between;margin:12px 0}#seek{width:100%}.track{padding:12px 0;border-top:1px solid var(--line)}.lane{position:relative;height:35px;background:repeating-linear-gradient(90deg,#19211c 0,#19211c calc(10% - 1px),#38443d calc(10% - 1px),#38443d 10%);border-radius:5px;margin:10px 0}.clip{position:absolute;top:3px;height:29px;padding:2px 5px;background:#779b73;color:#101b10;white-space:nowrap;overflow:hidden;min-width:6px;cursor:grab;touch-action:none}.needle{position:absolute;top:0;bottom:0;width:2px;background:#f1dc8e;pointer-events:none}.muted,small{color:#aab9ad}#status{min-height:22px}a{color:var(--accent)}@media(max-width:760px){.shell{grid-template-columns:1fr}}
#video-studio{margin-top:18px}#video-studio h2{margin-top:0}#video-studio textarea{display:block;width:100%;min-height:130px;resize:vertical;padding:12px;background:#19211c;color:inherit;border:1px solid var(--line);border-radius:8px;font:inherit;margin:8px 0 12px}#video-preview{display:block;width:min(100%,500px);max-height:280px;margin:14px 0}#video-preview[hidden]{display:none}#video-status{overflow-wrap:anywhere}
</style>
<header>WhiteNoiseChoir / Studio</header>
<main>
<h1>Soundscape Studio</h1>
<div class="row">
<label>Mix name <input id="title" type="text" maxlength="100"></label>
<label>Length (min) <input id="minutes" type="number" min="0.1" max="180" step="0.1"></label>
<button id="share" class="primary">Copy draft link</button>
<button id="clear">New blank mix</button>
</div>
<div class="shell">
<section class="panel" aria-label="Timeline">
<div class="row"><button id="play" class="primary">Play</button><button id="reset">Back to start</button><button id="tail">Preview loop seam</button><button id="render">Render WAV</button><output id="time"></output></div>
<input id="seek" type="range" min="0" step=".01" aria-label="Playback position">
<div id="tracks"></div>
</section>
<aside class="panel"><h2>Sound library</h2><div id="library"></div><a href="/#mix=streamside">Open Streamside draft</a></aside>
</div>
<p id="status" role="status" class="muted"></p>
<section id="video-studio" class="panel">
<h2>Video</h2>
<label for="video-prompt">AI video prompt</label>
<textarea id="video-prompt" maxlength="3000" placeholder="Add a prompt for this mix"></textarea>
<div class="row"><button id="copy-prompt">Copy prompt</button><label>Upload a short clip <input type="file" id="video-input" accept="video/*,.mov,.mkv"></label><button id="render-video" class="primary" disabled>Render MP4</button></div>
<p class="muted">The clip repeats to match the mix. The exported video uses the mix audio.</p>
<video id="video-preview" controls muted loop playsinline hidden></video>
<p id="video-status" role="status" aria-live="polite"></p>
</section>
<details><summary>Check audio output</summary><p>Play the original stream recording.</p><audio id="audio-check" controls preload="none"></audio></details>
</main>
<script>
const assets = [{"name": "Stream close-up", "key": "asset-library/raw/sha256/be/be201d2fd0d110fc3ef5d8af060e5ac48439fd54e9f26ce6b69825182748a95b.wav", "duration": 68.889, "source": "https://commons.wikimedia.org/wiki/File:433589_jackthemurray_stream-river-water-up-close.wav"}, {"name": "Clicking Stream Frog", "key": "asset-library/raw/sha256/0a/0a3c133128b94306396567cfc22ded8363645869d762c2bbc76b5c3519017cff.m4a", "duration": 11.865011, "source": "https://www.inaturalist.org/observations/111319279"}, {"name": "American Robin", "key": "asset-library/raw/sha256/0b/0bf24b2b08299380add4e29b6ed0c9ed37ffaa26a19e3908e5b572d75ef7cabe.m4a", "duration": 24.960998, "source": "https://www.inaturalist.org/observations/402220192"}, {"name": "Barred Owl", "key": "asset-library/raw/sha256/06/06c95f291596cfc813ff54d636ae926493ed6cd9c8a10d30f049a70460048af1.mp3", "duration": 62.261875, "source": "https://www.inaturalist.org/observations/349447210"}, {"name": "Common Eastern Bumble Bee", "key": "asset-library/raw/sha256/2b/2b5e3902314cbb5d54c26164dc4264a1fdebf61f5012e6f378f6f3e313c7e91a.m4a", "duration": 23.04, "source": "https://www.inaturalist.org/observations/243621492"}];
const media = 'https://media.whitenoisechoir.com/';
const $ = id => document.getElementById(id);
$('audio-check').src=media+assets[0].key;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const streamPrompt = 'Create an 8-second photorealistic 16:9 seamless loop of a shallow forest stream at dusk. Use a locked camera at bank level, with moss-covered stones and softly lit ferns framing the water. Keep exposure and focus fixed. Let only the flowing water and a few leaves move gently, with no sudden motion, cuts, people, text, or camera movement. Match the opening and closing composition and motion phase. Export a clean 1080p MP4 without audio.';
const sample = () => ({
  title: 'Streamside', length: 1800, videoPrompt:streamPrompt,
  tracks: assets.slice(0, 4).map((_, i) => ({asset:i, start:[0,42,105,180][i], gain:[.72,.23,.30,.18][i], loop:i===0, mute:false}))
});
function readMix(){
  try {
    const code = location.hash.slice(5);
    if (location.hash.startsWith('#mix=') && code !== 'streamside') {
      const saved = JSON.parse(decodeURIComponent(code));
      if (!Number.isFinite(saved.length) || !Array.isArray(saved.tracks)) throw Error();
      return {title:String(saved.title).slice(0,100), videoPrompt:typeof saved.videoPrompt==='string' ? saved.videoPrompt.slice(0,3000) : (/suối|stream/i.test(String(saved.title)) ? streamPrompt : ''), length:clamp(saved.length,6,10800),
        tracks:saved.tracks.slice(0,32).filter(t=>assets[t.asset] && Number.isFinite(t.start) && Number.isFinite(t.gain))
          .map(t=>({asset:Number(t.asset),start:clamp(t.start,0,saved.length),gain:clamp(t.gain,0,1),loop:!!t.loop,mute:!!t.mute}))};
    }
  } catch { $('status').textContent='This draft link could not be read. Streamside was loaded.'; }
  return sample();
}
let mix = readMix(), position=0, playing=false, anchor=0, frame=0, generation=0;
let context;
const buffers=new Map(), active=[];
function stop(){
  generation++;
  playing=false;
  cancelAnimationFrame(frame);
  for(const {node} of active.splice(0)) { try {node.stop();} catch {} }
  $('play').textContent='Play';
}
const format = n => [Math.floor(n/60), Math.floor(n%60)].map(v=>String(v).padStart(2,'0')).join(':');
function display(){
  $('seek').value=position;
  $('time').textContent=format(position)+' / '+format(mix.length);
  document.querySelectorAll('.needle').forEach(el=>el.style.left=(100*position/mix.length)+'%');
}
function tick(loopPreview=false){
  const elapsed=context.currentTime-anchor;
  const end=mix.length+(loopPreview?5:0);
  position=loopPreview && elapsed>=mix.length ? Math.min(5,elapsed-mix.length) : clamp(elapsed,0,mix.length);
  display();
  if(elapsed>=end) stop();
  else frame=requestAnimationFrame(()=>tick(loopPreview));
}
function load(i){
  if(!buffers.has(i)) buffers.set(i,fetch(media+assets[i].key).then(r=>{
    if(!r.ok) throw Error(assets[i].name);
    return r.arrayBuffer();
  }).then(b=>context.decodeAudioData(b)).catch(e=>{buffers.delete(i);throw e;}));
  return buffers.get(i);
}
async function play(loopPreview=false){
  if(playing){stop();return;}
  if(!mix.tracks.some(t=>!t.mute)) return;
  if(position>=mix.length) position=0;
  const token=++generation;
  $('status').textContent='Loading audio…';
  try {
    const AudioEngine=window.AudioContext || window.webkitAudioContext;
    context ||= new AudioEngine();
    await context.resume();
    const tracks=mix.tracks.filter(t=>!t.mute);
    const decoded=await Promise.allSettled(tracks.map(t=>load(t.asset)));
    if(token!==generation) return;
    const now=context.currentTime+.05;
    anchor=now-position;
    function schedule(from,to,base){
    tracks.forEach((t,i)=>{
      const buffer=decoded[i].value;
      if(!buffer) return;
      const elapsed=Math.max(0,from-t.start);
      const offset=t.loop ? elapsed%buffer.duration : elapsed;
      const when=base+Math.max(from,t.start);
      const span=Math.min(base+to-when,t.loop ? Infinity : buffer.duration-offset);
      if(span<=0) return;
      const node=context.createBufferSource(), gain=context.createGain();
      node.buffer=buffer;node.loop=t.loop;
      gain.gain.value=t.gain;
      node.connect(gain).connect(context.destination);
      node.start(when,offset,span);
      active.push({node,gain,track:t});
    });
    }
    schedule(position,mix.length,anchor);
    if(loopPreview) schedule(0,5,anchor+mix.length);
    if(decoded.every(r=>r.status==='rejected')) throw Error('Audio decoding failed');
    playing=true;$('play').textContent='Pause';
    const skipped=tracks.filter((_,i)=>decoded[i].status==='rejected').map(t=>assets[t.asset].name);
    $('status').textContent=skipped.length?'Unavailable tracks: '+[...new Set(skipped)].join(', '):'';
    tick(loopPreview);
  } catch(e){if(token===generation){stop();$('status').textContent='Audio could not load. Try again or replace the source.';}}
}
function locate(value){
  const resume=playing;
  stop();position=clamp(value,0,mix.length);display();
  if(resume) play();
}
function change(fn){
  const resume=playing;
  stop();fn();render();
  if(resume) play();
}
function node(tag,text,cls){
  const el=document.createElement(tag);
  if(text) el.textContent=text;
  if(cls) el.className=cls;
  return el;
}
function button(text,action){
  const el=node('button',text);el.onclick=action;return el;
}
function field(text,input){const el=node('label',text);el.append(input);return el;}
function render(){
  $('video-prompt').value=mix.videoPrompt || '';
  $('title').value=mix.title;$('minutes').value=mix.length/60;
  $('seek').max=mix.length;
  $('tracks').replaceChildren();
  if(!mix.tracks.length) $('tracks').append(node('p','Add a sound from the library.','muted'));
  mix.tracks.forEach((t,i)=>{
    const asset=assets[t.asset], card=node('div','','track'), top=node('div','','row');
    const select=node('select');select.setAttribute('aria-label','Sound source');
    assets.forEach((a,j)=>{const o=node('option',a.name);o.value=j;select.append(o);});
    select.value=t.asset;select.onchange=()=>change(()=>{t.asset=Number(select.value);});
    const start=node('input');start.type='number';start.min=0;start.max=mix.length;start.step='.1';start.value=t.start;
    start.onchange=()=>change(()=>{t.start=clamp(Number(start.value),0,mix.length);});
    const volume=node('input');volume.type='range';volume.min=0;volume.max=1;volume.step='.01';volume.value=t.gain;
    volume.oninput=()=>{t.gain=Number(volume.value);const playingTrack=active.find(x=>x.track===t);if(playingTrack) playingTrack.gain.gain.value=t.gain;};
    const loop=button('Loop',()=>change(()=>{t.loop=!t.loop;}));loop.setAttribute('aria-pressed',t.loop);
    const mute=button('Mute',()=>change(()=>{t.mute=!t.mute;}));mute.setAttribute('aria-pressed',t.mute);
    const source=node('a','CC0 source');source.href=asset.source;source.target='_blank';source.rel='noopener noreferrer';
    top.append(select,field('Start (s)',start),field('Volume',volume),loop,mute,button('Remove',()=>change(()=>mix.tracks.splice(i,1))),source);
    const lane=node('div','','lane'), clip=node('div',asset.name,'clip');
    const place = value => {
      clip.style.left=100*value/mix.length+'%';
      clip.style.width=100*Math.min(mix.length-value,t.loop?mix.length:asset.duration)/mix.length+'%';
    };
    place(t.start);
    clip.onpointerdown=e=>{
      clip.setPointerCapture(e.pointerId);
      const startX=e.clientX, original=t.start;
      let target=original;
      clip.onpointermove=p=>{target=clamp(original+(p.clientX-startX)*mix.length/lane.clientWidth,0,mix.length);place(target);};
      clip.onpointerup=()=>change(()=>{t.start=Math.round(target*10)/10;});
      clip.onpointercancel=()=>place(t.start);
    };
    lane.append(clip,node('div','','needle'));card.append(top,lane);$('tracks').append(card);
  });
  display();
}

$('tail').onclick=()=>{
  stop();
  position=Math.max(0,mix.length-5);
  display();
  play(true);
};

async function buildWav(project,progress){
  const tracks=project.tracks.filter(t=>!t.mute && t.gain>0 && t.start<project.length);
  if(!tracks.length) throw Error('Add an audible track before rendering.');
    const Engine=window.AudioContext || window.webkitAudioContext;
    const Offline=window.OfflineAudioContext || window.webkitOfflineAudioContext;
    context ||= new Engine();
    const decoded=await Promise.all(tracks.map(t=>load(t.asset).catch(()=>{
      throw Error('Unable to load '+assets[t.asset].name);
    })));
    const rate=44100, frames=Math.ceil(project.length*rate);
    const header=new DataView(new ArrayBuffer(44));
    const tag=(offset,value)=>{for(let i=0;i<value.length;i++) header.setUint8(offset+i,value.charCodeAt(i));};
    tag(0,'RIFF');header.setUint32(4,36+frames*4,true);tag(8,'WAVE');tag(12,'fmt ');
    header.setUint32(16,16,true);header.setUint16(20,1,true);header.setUint16(22,2,true);
    header.setUint32(24,rate,true);header.setUint32(28,rate*4,true);
    header.setUint16(32,4,true);header.setUint16(34,16,true);tag(36,'data');
    header.setUint32(40,frames*4,true);
    const parts=[header.buffer];
    const tailStart=Math.max(0,frames-10*rate);
    let quiet=0,longest=0,peak=0;
    for(let first=0;first<frames;first+=30*rate){
      const count=Math.min(30*rate,frames-first);
      const offline=new Offline(2,count,rate);
      tracks.forEach((track,i)=>{
        const buffer=decoded[i];
        const trackStart=Math.round(track.start*rate);
        const start=Math.max(first,trackStart);
        const elapsed=(start-trackStart)/rate;
        const duration=Math.min((first+count-start)/rate,track.loop?Infinity:buffer.duration-elapsed);
        if(duration<=0) return;
        const source=offline.createBufferSource(), gain=offline.createGain();
        source.buffer=buffer;source.loop=track.loop;gain.gain.value=track.gain;
        source.connect(gain).connect(offline.destination);
        source.start((start-first)/rate,track.loop?elapsed%buffer.duration:elapsed,duration);
      });
      const rendered=await offline.startRendering();
      const left=rendered.getChannelData(0),right=rendered.getChannelData(1);
      const pcm=new DataView(new ArrayBuffer(count*4));
      for(let i=0;i<count;i++){
        const amplitude=Math.max(Math.abs(left[i]),Math.abs(right[i]));
        peak=Math.max(peak,amplitude);
        pcm.setInt16(i*4,Math.round(clamp(left[i],-1,1)*32767),true);
        pcm.setInt16(i*4+2,Math.round(clamp(right[i],-1,1)*32767),true);
        if(first+i>=tailStart){
          quiet=amplitude<.001?quiet+1:0;
          longest=Math.max(longest,quiet);
        }
      }
      parts.push(pcm.buffer);
      progress(Math.round(100*(first+count)/frames));
    }

  return {blob:new Blob(parts,{type:'audio/wav'}), silence:longest/rate, clipped:peak>1};
}
function downloadResult(status,blob,title,ext,description=''){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=(title.replace(/[\\/:*?"<>|]/g,'-').trim() || 'soundscape')+'.'+ext;
  link.textContent='Download '+ext.toUpperCase();
  status.replaceChildren(link,document.createTextNode(description));
  link.onclick=()=>setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$('render').onclick=async()=>{
  const status=$('status'), button=$('render'), project=structuredClone(mix);
  stop();button.disabled=true;
  status.textContent='Loading tracks for render…';
  try {
    const result=await buildWav(project,p=>{status.textContent='Rendering WAV · '+p+'%';});
    downloadResult(status,result.blob,project.title,'wav',
      ' · Last 10 s: longest interval below −60 dBFS '+result.silence.toFixed(3)+' s'+(result.clipped?' · Peaks clipped':''));
  } catch(error) {status.textContent='Render failed · '+error.message;}
  finally {button.disabled=false;}
};
$('video-prompt').oninput=()=>{mix.videoPrompt=$('video-prompt').value;};
$('copy-prompt').onclick=async()=>{
  const prompt=$('video-prompt');
  if(!prompt.value){prompt.focus();return;}
  try {await navigator.clipboard.writeText(prompt.value);$('video-status').textContent='Prompt copied.';}
  catch {prompt.select();$('video-status').textContent='Copy the selected prompt.';}
};
let clipUrl;
$('video-input').onchange=()=>{
  const file=$('video-input').files[0], preview=$('video-preview');
  if(clipUrl) URL.revokeObjectURL(clipUrl);
  clipUrl=file ? URL.createObjectURL(file) : null;
  preview.hidden=!file;
  if(file) preview.src=clipUrl;
  else {preview.removeAttribute('src');preview.load();}
  $('render-video').disabled=!file;
  $('video-status').textContent=file ? 'Clip selected: '+file.name : '';
};
$('render-video').onclick=async()=>{
  const input=$('video-input'), button=$('render-video'), status=$('video-status');
  const file=input.files[0], project=structuredClone(mix);
  if(!file) return;
  button.disabled=true;input.disabled=true;stop();
  let ffmpeg,worker;
  try {
    status.textContent='Loading video renderer and mixing audio…';
    const cdn='https://cdn.jsdelivr.net/npm/';
    const ff=cdn+'@ffmpeg/ffmpeg@0.12.15/dist/esm/';
    const core=cdn+'@ffmpeg/core@0.12.10/dist/esm/';
    const {FFmpeg}=await import(ff+'index.js');
    worker=URL.createObjectURL(new Blob(['import '+JSON.stringify(ff+'worker.js')+';'],{type:'text/javascript'}));
    ffmpeg=new FFmpeg();
    await ffmpeg.load({classWorkerURL:worker,coreURL:core+'ffmpeg-core.js',wasmURL:core+'ffmpeg-core.wasm'});
    const audio=await buildWav(project,p=>{status.textContent='Mixing audio · '+p+'%';});
    await ffmpeg.writeFile('clip',new Uint8Array(await file.arrayBuffer()));
    await ffmpeg.writeFile('mix.wav',new Uint8Array(await audio.blob.arrayBuffer()));
    status.textContent='Rendering video…';
    ffmpeg.on('progress',({time})=>{
      const percent=Math.max(0,Math.min(99,Math.round(time/10000/project.length)));
      status.textContent='Rendering video · '+percent+'%';
    });
    const result=await ffmpeg.exec(['-stream_loop','-1','-i','clip','-i','mix.wav',
      '-map','0:v:0','-map','1:a:0','-t',String(project.length),
      '-vf','scale=trunc(iw/2)*2:trunc(ih/2)*2','-c:v','libx264','-preset','ultrafast',
      '-pix_fmt','yuv420p','-c:a','aac','-b:a','192k','-movflags','+faststart','mix.mp4']);
    if(result!==0) throw Error('Could not encode the uploaded clip.');
    const output=await ffmpeg.readFile('mix.mp4');
    if(!output.byteLength) throw Error('The renderer produced an empty file.');
    downloadResult(status,new Blob([output],{type:'video/mp4'}),project.title,'mp4');
  } catch(error){status.textContent='Video render failed · '+error.message;}
  finally {
    if(ffmpeg) ffmpeg.terminate();
    if(worker) URL.revokeObjectURL(worker);
    input.disabled=false;button.disabled=!input.files.length;
  }
};
$('play').onclick=()=>play();
$('reset').onclick=()=>locate(0);
$('seek').oninput=()=>locate(Number($('seek').value));
$('title').oninput=()=>{mix.title=$('title').value;};
$('minutes').onchange=()=>change(()=>{mix.length=clamp(Number($('minutes').value)*60,6,10800);position=Math.min(position,mix.length);mix.tracks.forEach(t=>{t.start=Math.min(t.start,mix.length);});});
$('clear').onclick=()=>{stop();position=0;mix={title:'Untitled mix',length:1800,tracks:[]};history.replaceState(null,'',location.pathname);render();};
$('share').onclick=async()=>{
  const url=new URL(location.href);url.hash='mix='+encodeURIComponent(JSON.stringify(mix));
  history.replaceState(null,'',url);
  try{await navigator.clipboard.writeText(url.href);$('status').textContent='Draft link copied.';}
  catch{$('status').textContent='Copy the draft link from the address bar.';}
};
assets.forEach((a,i)=>{
  const row=node('div','','row');
  row.append(node('span',a.name),button('Add',()=>change(()=>{
    if(mix.tracks.length>=32){$('status').textContent='This draft can hold up to 32 tracks.';return;}
    mix.tracks.push({asset:i,start:position,gain:.35,loop:false,mute:false});
  })));$('library').append(row);
});
window.addEventListener('hashchange',()=>{stop();position=0;mix=readMix();render();});
render();
</script>
</html>
