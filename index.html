    const tailStart=Math.max(0,frames-10*rate);
    let quiet=0,longest=0,peak=0;
    for(let first=0;first<frames;first+=30*rate){
      const count=Math.min(30*rate,frames-first);
      const lead=Math.min(first,Math.round(rate*.25));
      const blockStart=(first-lead)/rate;
      const offline=new Offline(2,count+lead,rate);
      tracks.forEach((track,i)=>{
        scheduleTrack(offline,decoded[i],track,blockStart,(first+count)/rate,-blockStart,project.length);
      });
      const rendered=await offline.startRendering();
      const left=rendered.getChannelData(0).subarray(lead),right=rendered.getChannelData(1).subarray(lead);
      const pcm=new DataView(new ArrayBuffer(count*4));
      for(let i=0;i<count;i++){
        const amplitude=Math.max(Math.abs(left[i]),Math.abs(right[i]));
        peak=Math.max(peak,amplitude);
        pcm.setInt16(i*4,Math.round(clamp(left[i],-1,1)*32767),true);
        pcm.setInt16(i*4+2,Math.round(clamp(right[i],-1,1)*32767),true);
        if(first+i>=tailStart){
          quiet=amplitude<.001?quiet+1:0;
          longest=Math.max(longest,quiet);
        }
      }
      parts.push(pcm.buffer);
      progress(Math.round(100*(first+count)/frames));
    }

  return {blob:new Blob(parts,{type:'audio/wav'}), silence:longest/rate, clipped:peak>1};
}
function downloadResult(status,blob,title,ext,description=''){
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url;
  link.download=(title.replace(/[\\/:*?"<>|]/g,'-').trim() || 'soundscape')+'.'+ext;
  link.textContent='Download '+ext.toUpperCase();
  status.replaceChildren(link,document.createTextNode(description));
  link.onclick=()=>setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$('render').onclick=async()=>{
  const status=$('status'), button=$('render'), project=structuredClone(mix);
  stop();button.disabled=true;
  status.textContent='Loading tracks for render…';
  try {
    const result=await buildWav(project,p=>{status.textContent='Rendering WAV · '+p+'%';});
    downloadResult(status,result.blob,project.title,'wav',
      ' · Last 10 s: longest interval below −60 dBFS '+result.silence.toFixed(3)+' s'+(result.clipped?' · Peaks clipped':''));
  } catch(error) {status.textContent='Render failed · '+error.message;}
  finally {button.disabled=false;}
};
$('video-prompt').oninput=()=>{mix.videoPrompt=$('video-prompt').value;};
$('copy-prompt').onclick=async()=>{
  const prompt=$('video-prompt');
  if(!prompt.value){prompt.focus();return;}
  try {await navigator.clipboard.writeText(prompt.value);$('video-status').textContent='Prompt copied.';}
  catch {prompt.select();$('video-status').textContent='Copy the selected prompt.';}
};
let clipUrl;
$('video-input').onchange=()=>{
  const file=$('video-input').files[0], preview=$('video-preview');
  if(clipUrl) URL.revokeObjectURL(clipUrl);
  clipUrl=file ? URL.createObjectURL(file) : null;
  preview.hidden=!file;
  if(file) preview.src=clipUrl;
  else {preview.removeAttribute('src');preview.load();}
  $('render-video').disabled=!file;
  $('video-status').textContent=file ? 'Clip selected: '+file.name : '';
};
$('render-video').onclick=async()=>{
  const input=$('video-input'), button=$('render-video'), status=$('video-status');
  const file=input.files[0], project=structuredClone(mix);
  if(!file) return;
  button.disabled=true;input.disabled=true;stop();
  let ffmpeg,worker;
  try {
    status.textContent='Loading video renderer and mixing audio…';
    const cdn='https://cdn.jsdelivr.net/npm/';
    const ff=cdn+'@ffmpeg/ffmpeg@0.12.15/dist/esm/';
    const core=cdn+'@ffmpeg/core@0.12.10/dist/esm/';
    const {FFmpeg}=await import(ff+'index.js');
    worker=URL.createObjectURL(new Blob(['import '+JSON.stringify(ff+'worker.js')+';'],{type:'text/javascript'}));
    ffmpeg=new FFmpeg();
    await ffmpeg.load({classWorkerURL:worker,coreURL:core+'ffmpeg-core.js',wasmURL:core+'ffmpeg-core.wasm'});
    const audio=await buildWav(project,p=>{status.textContent='Mixing audio · '+p+'%';});
    await ffmpeg.writeFile('clip',new Uint8Array(await file.arrayBuffer()));
    await ffmpeg.writeFile('mix.wav',new Uint8Array(await audio.blob.arrayBuffer()));
    status.textContent='Rendering video…';
    ffmpeg.on('progress',({time})=>{
      const percent=Math.max(0,Math.min(99,Math.round(time/10000/project.length)));
      status.textContent='Rendering video · '+percent+'%';
    });
    const result=await ffmpeg.exec(['-stream_loop','-1','-i','clip','-i','mix.wav',
      '-map','0:v:0','-map','1:a:0','-t',String(project.length),
      '-vf','scale=trunc(iw/2)*2:trunc(ih/2)*2','-c:v','libx264','-preset','ultrafast',
      '-pix_fmt','yuv420p','-c:a','aac','-b:a','192k','-movflags','+faststart','mix.mp4']);
    if(result!==0) throw Error('Could not encode the uploaded clip.');
    const output=await ffmpeg.readFile('mix.mp4');
    if(!output.byteLength) throw Error('The renderer produced an empty file.');
    downloadResult(status,new Blob([output],{type:'video/mp4'}),project.title,'mp4');
  } catch(error){status.textContent='Video render failed · '+error.message;}
  finally {
    if(ffmpeg) ffmpeg.terminate();
    if(worker) URL.revokeObjectURL(worker);
    input.disabled=false;button.disabled=!input.files.length;
  }
};
$('play').onclick=()=>play();
$('reset').onclick=()=>locate(0);
$('seek').oninput=()=>locate(Number($('seek').value));
$('title').oninput=()=>{mix.title=$('title').value;};
$('minutes').onchange=()=>change(()=>{mix.length=clamp(Number($('minutes').value)*60,6,10800);position=Math.min(position,mix.length);mix.tracks.forEach(t=>{t.start=Math.min(t.start,mix.length);});});
$('clear').onclick=()=>{stop();position=0;mix={title:'Untitled mix',length:1800,tracks:[]};history.replaceState(null,'',location.pathname);render();};
$('share').onclick=async()=>{
  const url=new URL(location.href);url.hash='mix='+encodeURIComponent(JSON.stringify(mix));
  history.replaceState(null,'',url);
  try{await navigator.clipboard.writeText(url.href);$('status').textContent='Draft link copied.';}
  catch{$('status').textContent='Copy the draft link from the address bar.';}
};
assets.forEach((a,i)=>{
  const row=node('div','','row');
  row.append(node('span',a.name),button('Add',()=>change(()=>{
    if(mix.tracks.length>=32){$('status').textContent='This draft can hold up to 32 tracks.';return;}
    mix.tracks.push({asset:i,start:position,gain:.35,loop:false,mute:false});
  })));$('library').append(row);
});
window.addEventListener('hashchange',()=>{stop();position=0;mix=readMix();render();});
render();
