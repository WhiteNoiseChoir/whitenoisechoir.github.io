name: WNC Chat-to-Mix contract checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'studio-private-music-optin.mjs'
      - 'studio-ui.js'
      - 'scripts/test_private_music_bridge.mjs'
      - 'scripts/test_ingest_private_pixabay_music.py'
      - 'scripts/ingest_private_pixabay_music.py'
      - '.github/workflows/chat_to_mix_contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check studio-ui.js && node --check studio-private-music-optin.mjs && node scripts/test_private_music_bridge.mjs
      - run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3'
      - run: python -m unittest scripts.test_ingest_private_pixabay_music -v
