name: Sleeping Lake targeted R2 and Commons QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa_sleeping_lake_sources.py'
      - '.github/workflows/qa_sleeping_lake_sources.yml'
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  sleeping-lake-qa:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3'
      - name: Check existing sound and ingest one licensed CC0 lakeshore source
        run: python -u scripts/qa_sleeping_lake_sources.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium QA dependencies
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund 'playwright-core@1.57.0'
          if command -v google-chrome >/dev/null; then echo CHROME_BIN=$(command -v google-chrome) >> "$GITHUB_ENV"; else echo 'Chrome missing'; exit 1; fi
      - name: Test real browser decode of R2 candidates
        run: node scripts/qa_sleeping_lake_browser.mjs
      - name: Post QA report on PR
        if: always()
        run: |
          if test -s sleeping-lake-qa-summary.md; then
            gh pr comment '${{ github.event.pull_request.number }}' --body-file sleeping-lake-qa-summary.md || true
          fi
          if test -s sleeping-lake-browser-summary.md; then
            gh pr comment '${{ github.event.pull_request.number }}' --body-file sleeping-lake-browser-summary.md || true
          fi
      - name: Save report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleeping-lake-targeted-source-qa
          path: |
            sleeping-lake-qa-report.json
            sleeping-lake-browser-qa.json
          if-no-files-found: ignore
