name: WNC Ocean Cave — Verify Existing CC0 Source Objects
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ocean_cave_retrieve_oga_cc0_sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-five-audio-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Resolve exact per-file R2 SHA keys from immutable source ledgers
        run: |
          python - <<'PY'
          import os,json,datetime,sys
          sys.path.insert(0,'scripts')
          import boto3
          from botocore.config import Config
          from scripts.harvest_opengameart_cc0_to_r2 import request,parse_page,ident,BUCKET,ACCOUNT_ID,ROOT
          client=boto3.client("s3",endpoint_url="https://"+ACCOUNT_ID+".r2.cloudflarestorage.com",
            region_name="auto",aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
            config=Config(signature_version="s3v4",s3={"addressing_style":"path"}))
          results=[];errors=[]
          for slug in ["dripping-water-loop","beach-ocean-waves"]:
            url="https://opengameart.org/content/"+slug
            with request(url) as response:html=response.text
            meta,downloads,children,flags=parse_page(url,html)
            if not flags.get("cc0"): raise RuntimeError("Current page not CC0 "+url)
            for direct in downloads:
              ledger_key=ROOT+"downloads/"+ident(direct)+".json"
              try:
                ledger=json.loads(client.get_object(Bucket=BUCKET,Key=ledger_key)["Body"].read())
                for entry in ledger.get("assets",[]):
                  record=json.loads(client.get_object(Bucket=BUCKET,Key=entry["record_key"])["Body"].read())
                  head=client.head_object(Bucket=BUCKET,Key=entry["key"])
                  confirmed=int(head["ContentLength"])==record["file_bytes"] and head.get("Metadata",{}).get("sha256")==record["audio_sha256"]
                  results.append({"source_page":url,"title":meta.get("title"),"creator":meta.get("creator"),
                    "license":"CC0-1.0","license_snapshot_key":record.get("license_snapshot_key"),
                    "file_name":record.get("original_filename"),"sha256":record["audio_sha256"],
                    "asset_key":entry["key"],"record_key":entry["record_key"],
                    "duration_seconds":record.get("duration_seconds"),"sample_rate_hz":record.get("sample_rate_hz"),
                    "channels":record.get("channels"),"file_bytes":record.get("file_bytes"),
                    "r2_head_checksum_size_confirmed":confirmed,
                    "publicationApproved":False,"studio_listening_verified":False})
              except Exception as e:
                errors.append({"direct_url":direct,"error":str(e)[:170]})
          report={"schema":"wnc_ocean_cave_oga_cc0_sha_lookup_v1","checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"files":results,"errors":errors}
          print("OCEAN_CAVE_CC0_SOURCE_SHA_REPORT "+json.dumps(report,ensure_ascii=False),flush=True)
          with open("ocean-cave-oga-cc0-verified-sources.json","w") as f:json.dump(report,f,ensure_ascii=False,indent=2)
          if not results or not all(x["r2_head_checksum_size_confirmed"] for x in results):raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocean-cave-oga-cc0-verified-sources
          path: ocean-cave-oga-cc0-verified-sources.json
          if-no-files-found: warn
          retention-days: 30
