name: WNC Licensed Batch Intake v2 — Offline QA
on:
  push:
    branches: [feature/licensed-batch-intake-20261116]
    paths:
      - 'scripts/harvest_commons_cc0_to_r2.py'
      - 'scripts/test_licensed_batch_intake_v2.py'
      - '.github/workflows/qa_licensed_batch_intake_v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/harvest_commons_cc0_to_r2.py'
      - 'scripts/test_licensed_batch_intake_v2.py'
      - '.github/workflows/qa_licensed_batch_intake_v2.yml'
permissions:
  contents: read
jobs:
  offline-license-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client dependencies (no R2 secrets or network downloads)
        run: python -m pip install -q 'boto3>=1.36,<2'
      - name: Compile and test CC0 and CC BY staging contracts
        run: |
          python -m py_compile scripts/harvest_commons_cc0_to_r2.py
          python scripts/test_licensed_batch_intake_v2.py -v
