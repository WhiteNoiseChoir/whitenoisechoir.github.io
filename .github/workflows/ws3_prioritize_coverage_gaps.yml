name: WS3 Private Coverage Gap Prioritization
on:
  push:
    branches: [feature/ws3-sleep-relax-coverage-20261114]
    paths:
      - scripts/ws3_prioritize_coverage_gaps.py
      - .github/workflows/ws3_prioritize_coverage_gaps.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ws3-private-gap-priority
  cancel-in-progress: false
jobs:
  prioritize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - run: python -m py_compile scripts/ws3_prioritize_coverage_gaps.py
      - name: Compute private coverage-gap priority checkpoint
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/ws3_prioritize_coverage_gaps.py
