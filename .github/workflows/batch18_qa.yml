name: Batch 18 Sound Library Quality Gate
on:
  push:
    branches: [main, "feature/batch18-*"]
    paths:
      - 'sounds/**'
      - 'assets/persistent.css'
      - 'catalog/batch18-20261108.json'
      - 'scripts/test_batch18_pages.cjs'
      - 'scripts/test_batch18_audio.py'
      - 'scripts/test_batch18_browser.cjs'
      - '.github/workflows/batch18_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content-source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 18 page sources, metadata, canonical and sound links
        run: |
          node scripts/test_batch18_pages.cjs
          node scripts/test_library_structure.cjs
      - name: Decode actual 18 source MP3 files and inspect existing HLS
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 scripts/test_batch18_audio.py
      - name: Inspect 14 new Sound Pages on mobile with persistent playback
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/wnc-batch18-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node scripts/test_batch18_browser.cjs
