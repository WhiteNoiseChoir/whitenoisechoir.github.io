name: Build 10-minute White Pink Brown Masters (Batch 02)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_color_masters.py'
      - '.github/workflows/color_masters.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whitenoisechoir-color-noise-masters
  cancel-in-progress: false
jobs:
  produce-and-qa-three-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install DSP and MP3 processing dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Syntax check
        run: python -m py_compile scripts/build_color_masters.py
      - name: Render and measure the final MP3 files
        run: python -u scripts/build_color_masters.py
      - name: Verify 3 ten-minute masters are complete and only intended files were generated
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=json.loads(Path('audio/color-master-manifest.json').read_text(encoding='utf-8'))
          t=d['tracks']
          assert len(t)==3
          assert {x['id'] for x in t}=={'white-noise','pink-noise','brown-noise'}
          assert d['duration_seconds']==600
          for a in t:
              q=a['qa']
              p=Path(a['file'])
              assert p.exists() and p.stat().st_size>10_000_000,p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==a['file_sha256']
              assert q['technical_status']=='PASS' and not q['flags'],q
              assert 599.8<=q['duration_seconds']<=600.2,q
              assert q['channels']==2 and q['sample_rate']==44100 and q['bitrate_kbps']==192
              assert q['true_peak_dbtp']<=-1.5 and q['crest_factor_db']<=23,q
              assert abs(q['spectral_slope_db_per_decade']-q['target_spectral_slope_db_per_decade'])<=2.5,q
              print(a['id'],q['rms_dbfs'],q['integrated_loudness_lufs'],q['spectral_slope_db_per_decade'])
          print('PASS: 3 original, distinct, 10-minute, technical-QA-gated MP3s')
          PY
      - name: Publish ONLY white pink brown and audit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/white-noise.mp3 audio/pink-noise.mp3 audio/brown-noise.mp3 audio/color-master-manifest.json
          if git diff --cached --quiet; then
            echo "Original color masters already current"
          else
            git commit -m "Publish three original 10-minute white pink brown noise masters after QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
