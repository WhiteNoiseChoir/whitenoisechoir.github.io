name: Nature Metadata R2 Inventory Read Only
on:
  push:
    branches: [audit/nature-metadata-readonly-20261113]
    paths: [.github/workflows/nature_metadata_r2_readonly_20261113.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2'
      - name: Count nature metadata, audio evidence, and music candidates without writing to R2
        run: python -u scripts/audit_nature_metadata_readonly_20261113.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nature-metadata-readonly-inventory-20261113
          path: audits/nature-metadata-readonly-20261113.json
          if-no-files-found: warn
          retention-days: 30
