name: Nature Source Discovery Regression
on:
  push:
    branches: [feature/nature-source-discovery-pagination-20261113]
    paths:
      - 'scripts/harvest_targeted_nature_to_r2.py'
      - 'scripts/test_targeted_nature_discovery.py'
      - '.github/workflows/nature_discovery_regression.yml'
  pull_request:
    paths:
      - 'scripts/harvest_targeted_nature_to_r2.py'
      - 'scripts/test_targeted_nature_discovery.py'
      - '.github/workflows/nature_discovery_regression.yml'
permissions:
  contents: read
jobs:
  discovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing discovery dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Verify syntax and offline discovery regression
        run: |
          python -m py_compile scripts/harvest_targeted_nature_to_r2.py scripts/test_targeted_nature_discovery.py
          python scripts/test_targeted_nature_discovery.py -v
  discovery-live-readonly:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: discovery-tests
    timeout-minutes: 22
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing discovery dependencies (read-only smoke)
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Check R2 connection without writes
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Discover actual licensed candidates without downloading or writing R2
        run: python -u scripts/harvest_targeted_nature_to_r2.py --batch-size 180 --discovery-only
