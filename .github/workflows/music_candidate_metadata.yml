name: Music Candidate Metadata Index — 44 Families
on:
  push:
    branches: [feature/music-candidate-metadata-index-20261113]
    paths:
      - 'scripts/scan_music_candidate_metadata.py'
      - 'scripts/test_music_candidate_metadata.py'
      - '.github/workflows/music_candidate_metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-music-candidate-index
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  PYTHONUNBUFFERED: '1'
jobs:
  metadata-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing audio intake dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test candidate metadata schema and music intake regressions
        run: |
          python -m py_compile scripts/scan_music_candidate_metadata.py scripts/test_music_candidate_metadata.py
          python scripts/test_music_candidate_metadata.py -v
          python scripts/test_music_instrument_intake.py -v

  metadata-candidate-index:
    needs: metadata-offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and R2 dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Confirm approved R2 secrets present
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Collect licensed metadata only, in a private create-only index
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -u scripts/scan_music_candidate_metadata.py --persist \
            --shard-index "$SHARD" --shard-count 2 --max-candidates 500 \
            --per-group 38 --per-group-api-requests 9 \
            --output "audits/music-candidates-shard-$SHARD.json"
      - name: Preserve source metadata and audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-candidates-shard-${{ matrix.shard }}
          path: audits/music-candidates-shard-*.json
          if-no-files-found: warn
          retention-days: 30
