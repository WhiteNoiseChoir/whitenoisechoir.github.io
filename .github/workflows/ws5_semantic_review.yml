name: WS5 Semantic QA — private R2 record audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ws5_semantic_review.py'
      - 'scripts/test_ws5_semantic_review.py'
      - '.github/workflows/ws5_semantic_review.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ws5_semantic_review.py'
      - '.github/workflows/ws5_semantic_review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wnc-ws5-private-semantic-qa
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies (NO model downloads)
        run: python -m pip install -q 'numpy>=1.26,<3' 'boto3>=1.36,<2'
      - name: Check pure QA and existing semantic contracts
        run: |
          python -m unittest discover -s scripts -p 'test_ws5_semantic_review.py' -v
          python -m unittest discover -s scripts -p 'test_ws5_semantic_intelligence.py' -v
          python -m py_compile scripts/ws5_semantic_review.py
  inspect-private-r2:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'feat(ws5): activate semantic QA')))
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight R2 JSON dependencies only
        run: python -m pip install -q 'numpy>=1.26,<3' 'boto3>=1.36,<2'
      - name: Audit eight CLAP records and save private review queue
        run: python -u scripts/ws5_semantic_review.py
      # No original audio downloads, no AI model invocation or public artifacts.
      # Source names/keys, predictions and per-record review flags remain in R2 Private.
      # No schedule. No changes to Studio, original WS5 v1 or CLAP checkpoint.
