name: WS3 Private Sleep Relax Coverage Baseline
on:
  push:
    branches: [feature/ws3-sleep-relax-coverage-20261114]
    paths:
      - .github/workflows/ws3_sleep_relax_coverage.yml
      - scripts/ws3_sleep_relax_coverage.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ws3-private-sleep-relax-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install S3 client
        run: python -m pip install -q 'boto3>=1.36,<2'
      - name: Verify private R2 access and calculate soundscape coverage
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          python -u scripts/ws3_sleep_relax_coverage.py
