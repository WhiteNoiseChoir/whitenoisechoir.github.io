name: Deploy WhiteNoiseChoir
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          python -m pip install numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Build static website with 20 sound files
        run: |
          mkdir -p dist
          cp index.html robots.txt sitemap.xml .nojekyll dist/
          python scripts/generate_audio.py
          test "$(find dist/audio -name '*.mp3' | wc -l)" -eq 20
      - name: Sync generated MP3s into repository
        run: |
          mkdir -p audio
          cp -f dist/audio/*.mp3 audio/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "Audio files already up to date"
          else
            git commit -m "Add 20 generated original MP3 sound tracks"
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
