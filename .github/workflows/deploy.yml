name: Build WhiteNoiseChoir Audio Library
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whitenoisechoir-audio-build
  cancel-in-progress: true
jobs:
  build-and-publish-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio dependencies
        run: |
          python -m pip install numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate original noise textures and import CC0 field recordings
        run: |
          python scripts/generate_audio.py
          python scripts/import_cc0.py
          test "$(find dist/audio -name '*.mp3' | wc -l)" -eq 31
          test -s dist/audio/cc0-sources.json
      - name: Publish audio to main branch for GitHub Pages
        run: |
          mkdir -p audio
          cp -f dist/audio/*.mp3 audio/
          cp -f dist/audio/cc0-sources.json audio/
          find audio -maxdepth 1 -type f -name '*-synth.mp3' ! -name 'cabin-hum-synth.mp3' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio/
          if git diff --cached --quiet; then
            echo "Library assets already current"
          else
            git commit -m "Replace generic noise imitations with verified CC0 ambience recordings"
            git push origin HEAD:main
          fi
