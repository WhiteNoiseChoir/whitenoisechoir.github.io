name: Audit Legacy CC0 Preview Import (Manual, No Promotion)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-original-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout protected audio masters
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required FFmpeg and numpy
        run: |
          python -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify older source previews in an isolated directory
        run: |
          python scripts/import_cc0.py
          test "$(find dist/audio -name '*.mp3' | wc -l)" -eq 5
          test -s dist/audio/cc0-sources.json
          echo "Audit-only: preview files remain in dist/ and are NOT committed to the production library."
          echo "Production MP3s may only be replaced through separately QA-gated master workflows."
