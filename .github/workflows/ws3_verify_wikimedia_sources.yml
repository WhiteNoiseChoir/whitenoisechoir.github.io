name: WS3 Private Wikimedia Source Verification
on:
  push:
    branches: [feature/ws3-sleep-relax-coverage-20261114]
    paths:
      - scripts/ws3_verify_wikimedia_sources.py
      - .github/workflows/ws3_verify_wikimedia_sources.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ws3-source-verification-private
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - run: python -m py_compile scripts/ws3_verify_wikimedia_sources.py
      - name: Verify Wikimedia source metadata against live provider
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/ws3_verify_wikimedia_sources.py
