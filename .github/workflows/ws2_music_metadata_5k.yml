name: WS2 Music Metadata Expansion to 5000 (feature only)
on:
  push:
    branches: [feature/music-metadata-expand-5k-20261113]
    paths:
      - '.github/workflows/ws2_music_metadata_5k.yml'
      - 'scripts/expand_music_metadata_5k.py'
      - 'scripts/test_expand_music_metadata_5k.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-ws2-music-5k
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  PYTHONUNBUFFERED: '1'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - run: |
          python -m py_compile scripts/expand_music_metadata_5k.py scripts/test_expand_music_metadata_5k.py
          python scripts/test_expand_music_metadata_5k.py -v
          python scripts/test_openverse_music_metadata.py -v
          python scripts/test_archive_music_metadata.py -v
  bounded-intake:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Confirm private R2 credentials
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Discover new source metadata, checkpoint and count private R2 objects
        run: |
          python -u scripts/expand_music_metadata_5k.py \
            --target 5000 --max-waves 18 \
            --requests-per-wave 125 --seconds-per-wave 1200 \
            --total-seconds 4500 --new-per-wave 250 \
            --output audits/ws2-5k.json
      - name: Preserve private aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ws2-5k-report
          path: audits/ws2-5k.json
          if-no-files-found: warn
          retention-days: 30
