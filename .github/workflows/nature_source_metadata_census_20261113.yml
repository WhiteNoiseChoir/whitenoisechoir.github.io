name: Nature Source Metadata Full Classification Read Only
on:
  push:
    branches: [audit/nature-metadata-readonly-20261113]
    paths: [.github/workflows/nature_source_metadata_census_20261113.yml]
permissions:
  contents: read
jobs:
  read-only-census:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2'
      - name: Classify existing source metadata in R2 (read only, no download or harvest)
        run: python -u scripts/audit_nature_source_census_20261113.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nature-source-metadata-census-20261113
          path: audits/nature-source-metadata-census-20261113.json
          if-no-files-found: warn
          retention-days: 30
