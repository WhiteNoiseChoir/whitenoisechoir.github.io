name: Audio Library Inventory Snapshot
run-name: Export encrypted metadata after intake run 42979394816
on:
  push:
    branches:
      - report/catalog-coverage-20261111
permissions:
  contents: read
jobs:
  prepare-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' requests beautifulsoup4 cryptography
      - name: Prepare encrypted automation storage
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import base64, hashlib, hmac, os
          from botocore.exceptions import ClientError
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from harvest_nature_diversity_to_r2 import Intake, BUCKET

          s3 = Intake().s3
          path = 'internal/wnc-catalog-20261111/bootstrap.enc'
          context = b'wnc-catalog-20261111 bootstrap'
          key = hmac.digest(os.environ['R2_SECRET_ACCESS_KEY'].encode(), context, hashlib.sha256)
          cipher = AESGCM(key)
          try:
              with s3.get_object(Bucket=BUCKET, Key=path)['Body'] as body:
                  encrypted = body.read()
              private = serialization.load_pem_private_key(cipher.decrypt(encrypted[:12], encrypted[12:], context), password=None)
          except ClientError as error:
              if error.response['Error']['Code'] not in ('404', 'NoSuchKey', 'NotFound'):
                  raise
              private = rsa.generate_private_key(public_exponent=65537, key_size=3072)
              data = private.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption())
              nonce = os.urandom(12)
              s3.put_object(Bucket=BUCKET, Key=path, Body=nonce + cipher.encrypt(nonce, data, context))
          public = private.public_key().public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)
          print('CHAIN_PUBLIC_KEY ' + base64.b64encode(public).decode())
          PY
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' requests beautifulsoup4 cryptography
      - name: Read R2 inventory and seal the metadata snapshot
        run: python -u scripts/export_audio_variant_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-audio-inventory
          path: snapshot.enc
          retention-days: 1
