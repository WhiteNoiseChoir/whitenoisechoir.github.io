name: Audio Library Inventory Snapshot
on:
  push:
    branches:
      - report/catalog-coverage-20261111
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' requests beautifulsoup4 cryptography
      - name: Read R2 inventory and seal the metadata snapshot
        run: python -u scripts/export_audio_variant_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-audio-inventory
          path: snapshot.enc
          retention-days: 1
