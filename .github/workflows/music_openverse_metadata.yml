name: Music Candidate Metadata — Openverse (third provider)
on:
  push:
    branches: [feature/music-openverse-metadata-20261113]
    paths:
      - 'scripts/scan_openverse_music_metadata.py'
      - 'scripts/test_openverse_music_metadata.py'
      - '.github/workflows/music_openverse_metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-openverse-music-metadata
  cancel-in-progress: false
env:
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: 'true'
  PYTHONUNBUFFERED: '1'
jobs:
  metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Test Openverse, Internet Archive, Commons and music intake
        run: |
          python -m py_compile scripts/scan_openverse_music_metadata.py scripts/test_openverse_music_metadata.py
          python scripts/test_openverse_music_metadata.py -v
          python scripts/test_archive_music_metadata.py -v
          python scripts/test_music_candidate_metadata.py -v
          python scripts/test_music_instrument_intake.py -v

  metadata-index:
    needs: metadata-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install metadata and R2 dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Confirm private R2 credentials present
        run: |
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Scan official Openverse API and persist candidate metadata only
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python -u scripts/scan_openverse_music_metadata.py --persist \
            --shard-index "$SHARD" --shard-count 2 \
            --max-candidates 500 --per-group 32 --pages 2 \
            --output "audits/music-openverse-candidates-$SHARD.json"
      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-openverse-candidates-shard-${{ matrix.shard }}
          path: audits/music-openverse-candidates-*.json
          if-no-files-found: warn
          retention-days: 30
