name: Nature Coverage Expansion
run-name: Sequential harvest and catalog reconciliation
on:
  push:
    branches: [feature/nature-coverage-expansion-20261111]
    paths: ['.github/workflows/nature_coverage_expansion.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-wide-nature-intake
  cancel-in-progress: false
env:
  AWS_EC2_METADATA_DISABLED: 'true'
  PYTHONUNBUFFERED: '1'
jobs:
  queue-1:
    name: Harvest and reconcile segment 1
    runs-on: ubuntu-latest
    timeout-minutes: 145
    outputs:
      done: ${{ steps.harvest.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing collector dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' cryptography
      - name: Reconcile the previous batch and process the remaining queue
        id: harvest
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/run_catalog_harvest_queue.py
  queue-2:
    name: Harvest and reconcile segment 2
    needs: queue-1
    if: needs.queue-1.outputs.done == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 145
    outputs:
      done: ${{ steps.harvest.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing collector dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' cryptography
      - name: Reconcile the previous batch and process the remaining queue
        id: harvest
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/run_catalog_harvest_queue.py
  queue-3:
    name: Harvest and reconcile segment 3
    needs: queue-2
    if: needs.queue-2.outputs.done == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 145
    outputs:
      done: ${{ steps.harvest.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing collector dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' cryptography
      - name: Reconcile the previous batch and process the remaining queue
        id: harvest
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/run_catalog_harvest_queue.py
  queue-4:
    name: Harvest and reconcile segment 4
    needs: queue-3
    if: needs.queue-3.outputs.done == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 145
    outputs:
      done: ${{ steps.harvest.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing collector dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' cryptography
      - name: Reconcile the previous batch and process the remaining queue
        id: harvest
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/run_catalog_harvest_queue.py
