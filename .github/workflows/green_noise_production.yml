name: Produce original Green Noise master and native HLS
on:
  push:
    branches:
      - feature/green-noise-original-20261108
    paths:
      - 'scripts/build_green_noise.py'
      - 'scripts/build_green_hls.py'
      - 'scripts/test_green_noise.py'
      - '.github/workflows/green_noise_production.yml'
permissions:
  contents: write
concurrency:
  group: whitenoisechoir-green-noise-production
  cancel-in-progress: false
jobs:
  build-and-commit-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy scipy
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Compile
        run: python3 -m py_compile scripts/build_green_noise.py scripts/build_green_hls.py scripts/test_green_noise.py
      - name: Synthesize independent 10-minute Green Noise MP3
        run: python3 -u scripts/build_green_noise.py
      - name: Author seven-day native HLS from the new verified master
        run: python3 -u scripts/build_green_hls.py
      - name: Verify decoded HLS boundary and preserve 21 existing streams
        run: python3 -u scripts/test_green_noise.py
      - name: Commit ONLY new Green Noise source and HLS artifacts to the feature branch
        run: |
          test "$GITHUB_REF_NAME" = "feature/green-noise-original-20261108"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/green-noise.mp3 audio/green-noise-master-manifest.json audio/continuous/green-noise audio/continuous/manifest.json
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "Add 10-minute original Green Noise master and 7-day HLS after QA"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
