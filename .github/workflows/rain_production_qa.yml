name: Rain First-Wave Production Release QA
on:
  push:
    branches: [main, "feature/rain-first-wave-production-20261108"]
    paths:
      - "audio/continuous/**"
      - "audio/*rain*-real.mp3"
      - "audio/distant-thunder-real.mp3"
      - "audio/rain-first-wave-provenance.json"
      - "catalog/**"
      - "index.html"
      - "sounds/**"
      - "sources.html"
      - "scripts/test_rain_production_release.cjs"
      - "scripts/test_batch18_pages.cjs"
      - "scripts/test_library_foundation.cjs"
      - "scripts/test_library_structure.cjs"
      - "scripts/test_rain_first_wave_review.cjs"
      - "scripts/test_rain_review_audio.py"
      - "signature/rain-review/**"
      - "scripts/test_rain_production_browser.cjs"
      - "scripts/test_hls_transport.py"
      - ".github/workflows/rain_production_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-3-and-legacy-22:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Existing catalog and HLS file integrity
        run: |
          node scripts/test_rain_production_release.cjs
          node scripts/test_rain_first_wave_review.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_library_structure.cjs
          node scripts/build_sound_library_foundation.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_batch18_pages.cjs
          node scripts/test_field_sound_pages.cjs
          node scripts/test_noise_colors_editorial.cjs
          node scripts/test_device_environment_editorial.cjs
      - name: Decode real audio across the 10-minute continuous HLS boundary
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 scripts/test_rain_review_audio.py
          python3 scripts/test_hls_transport.py
          python3 scripts/test_batch18_audio.py
      - name: Mobile 320/390 persistent playback and new source pages
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/wnc-rain3-qa.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          node scripts/test_rain_production_browser.cjs
          node scripts/test_rain_review_browser.cjs
          node scripts/test_library_foundation_browser.cjs
