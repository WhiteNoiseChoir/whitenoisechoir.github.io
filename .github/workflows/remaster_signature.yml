name: Remaster Signature Rain & Fireplace (QA only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/remaster_signature.py'
      - '.github/workflows/remaster_signature.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whitenoisechoir-signature-remaster
  cancel-in-progress: false
jobs:
  remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest source and 10 existing QA audio samples
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio analysis and mastering dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Remaster only Rain on Window and Fireplace
        run: python -u scripts/remaster_signature.py
      - name: Verify all ten files and manifest checksums
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path("signature")
          m=json.loads((root/"manifest.json").read_text())
          s=json.loads((root/"quality-summary.json").read_text())
          assert len(m["tracks"])==10 and s["total"]==10
          assert s["technical_passes"]+s["technical_review"]==10
          assert s["human_approved"]==0
          for t in m["tracks"]:
              p=root/t["file"]
              assert p.is_file() and p.stat().st_size>300000,p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==t["file_sha256"],t["id"]
              assert t["qa"]["duration_seconds"]>=59.5,t["id"]
          print("Validated all 10 MP3 files; only 2 require a remaster revision.")
          PY
      - name: Commit new versions of two audio files and updated QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signature/audio/rain-window.mp3 signature/audio/fireplace.mp3 signature/manifest.json signature/quality-summary.json
          if git diff --cached --quiet; then
            echo "No differences"
          else
            git commit -m "Improve Rain on Window and Fireplace dynamics; update measured QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
