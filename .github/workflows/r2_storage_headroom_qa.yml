name: R2 storage headroom and immutable HLS inventory

on:
  push:
    branches:
      - feature/r2-storage-budget-gate-20261109
      - main
    paths:
      - 'audits/r2-hls-immutable-source-inventory.json'
      - 'scripts/audit_r2_storage_budget.cjs'
      - 'audits/r2-github-hls-prune-plan-2026-11-09.md'
      - '.github/workflows/r2_storage_headroom_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read approved source tree (never modify or delete audio)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all 360 HLS blobs and compute 1GB budget/recovery estimate
        run: node scripts/audit_r2_storage_budget.cjs
      - name: Verify 35 sources, 45 mixes and R2 player primary
        run: node scripts/test_player_smoke.cjs
