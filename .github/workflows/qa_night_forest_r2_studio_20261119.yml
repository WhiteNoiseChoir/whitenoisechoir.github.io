name: WNC Forest Night CC0 Studio Transport QA
on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa_night_forest_r2_studio_20261119.py'
      - '.github/workflows/qa_night_forest_r2_studio_20261119.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wnc-forest-night-transport-qa
  cancel-in-progress: true
jobs:
  read-only-r2-browser-transport-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify registered SHA assets, public Range and Studio browser CORS
        run: python -u scripts/qa_night_forest_r2_studio_20261119.py
      - name: Save audit, including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnc-forest-night-transport-qa-20261119
          path: audits/night-forest-studio-transport-qa-20261119.json
          retention-days: 30
          if-no-files-found: warn
