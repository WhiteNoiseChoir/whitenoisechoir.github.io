name: WS5 CLAP + AudioSet — private human-review queue
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ws5_cross_model_triage.py'
      - 'scripts/test_ws5_cross_model_triage.py'
      - '.github/workflows/ws5_cross_model_triage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ws5_cross_model_triage.py'
      - '.github/workflows/ws5_cross_model_triage.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wnc-ws5-crossmodel-private-queue
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small dependencies; no pretrained models
        run: python -m pip install -q 'numpy>=1.26,<3' 'boto3>=1.36,<2'
      - name: Validate cross-model data isolation and source matching
        run: |
          python -m unittest discover -s scripts -p 'test_ws5_cross_model_triage.py' -v
          python -m py_compile scripts/ws5_cross_model_triage.py
  generate-private-review-queue:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'feat(ws5): activate cross model triage')))
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 JSON dependencies
        run: python -m pip install -q 'numpy>=1.26,<3' 'boto3>=1.36,<2'
      - name: Produce six-case private listening plan; zero audio transfers
        run: python -u scripts/ws5_cross_model_triage.py
      # Never publish original audio URLs, private assetRef, labels or file paths.
      # Only SHA-matched, unverified ML hints and 10s audition windows in PRIVATE R2.
