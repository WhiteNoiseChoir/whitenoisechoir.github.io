name: WNC R2 metadata to PRIVATE GitHub index (manual until configured)
on:
  push:
    branches: [main, feature/wnc-r2-private-index-bridge-20261114, feature/private-index-canonical-ws1-ws2-bridge-20261114]
    paths:
      - 'ops/metadata_sync_request.json'
      - 'scripts/sync_r2_metadata_private_github.py'
      - 'scripts/sync_r2_ai_index_private_github.py'
      - 'scripts/test_r2_ai_index_private_bridge.py'
      - 'scripts/test_r2_metadata_private_bridge.py'
      - '.github/workflows/r2_metadata_private_bridge.yml'
  pull_request:
    paths:
      - 'scripts/sync_r2_metadata_private_github.py'
      - 'scripts/sync_r2_ai_index_private_github.py'
      - 'scripts/test_r2_ai_index_private_bridge.py'
      - 'scripts/test_r2_metadata_private_bridge.py'
      - '.github/workflows/r2_metadata_private_bridge.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: read
concurrency:
  group: wnc-r2-metadata-private-bridge
  cancel-in-progress: false
jobs:
  offline-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-test HTTP client
        run: python -m pip install -q 'requests>=2.32,<3' 'boto3>=1.36,<2'
      - name: Verify private-only guard, metadata sanitization and JSONL sharding
        run: |
          python -m unittest discover -s scripts -p 'test_r2_metadata_private_bridge.py' -v
          python -m unittest discover -s scripts -p 'test_r2_ai_index_private_bridge.py' -v
  sync:
    if: >-
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'chore(metadata): sync-request'))
    needs: offline-security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WNC_METADATA_REPO_TOKEN: ${{ secrets.WNC_METADATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AWS client and GitHub API transport
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3'
      - name: PRIVATE repository visibility guard, R2 metadata scan and sync
        run: python scripts/sync_r2_ai_index_private_github.py
      # No public GitHub Action artifacts, PR comments, or logs contain metadata rows.
      # Only the explicit sync-request commit or manual dispatch can push private rows.
      # Enabled after first private sync verified. Cron is UTC; never changes WS2/WS3/WS4.
  readonly-canonical-preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/private-index-canonical-ws1-ws2-bridge-20261114'
    needs: offline-security-tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 metadata read-only dependencies
        run: python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3'
      - name: Validate real R2 WS1 + WS2 snapshot without publishing metadata
        run: python -u scripts/sync_r2_ai_index_private_github.py --local-only
      # No metadata artifacts, no PR comments, no Private index published from public repo.
