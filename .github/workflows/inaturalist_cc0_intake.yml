name: iNaturalist CC0 Wildlife Intake
on:
  push:
    branches:
      - feature/inaturalist-wildlife-intake-20261111
    paths:
      - 'scripts/harvest_inaturalist_cc0_to_r2.py'
      - '.github/workflows/inaturalist_cc0_intake.yml'
  workflow_dispatch:
    inputs:
      page:
        description: API page for each wildlife group and region
        default: '1'
        type: string
      per_group:
        description: Maximum recordings per query
        default: '22'
        type: string
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-inaturalist-intake
  cancel-in-progress: false
jobs:
  wildlife:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install intake dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Save original audio and source metadata
        env:
          INTAKE_PAGE: ${{ inputs.page || '1' }}
          INTAKE_PER_GROUP: ${{ inputs.per_group || '22' }}
        run: python -u scripts/harvest_inaturalist_cc0_to_r2.py --page "$INTAKE_PAGE" --per-group "$INTAKE_PER_GROUP"
      - name: Count unique R2 assets
        if: always()
        run: python -u scripts/audit_r2_asset_inventory.py
