name: Water Ocean Wave1 CC0 Audio Review Builder
on:
  push:
    branches: ["feature/water-ocean-wave1-review-20261109"]
    paths:
      - "scripts/build_water_ocean_wave1_review.py"
      - "scripts/test_water_ocean_wave1_review.cjs"
      - "scripts/test_water_ocean_wave1_browser.cjs"
      - "signature/water-ocean-wave1-review/index.html"
      - ".github/workflows/water_ocean_wave1_build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-review-three:
    if: github.ref_name == 'feature/water-ocean-wave1-review-20261109' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure FFmpeg and ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Produce three review-only CC0 600-second MP3 masters
        run: |
          python3 -m py_compile scripts/build_water_ocean_wave1_review.py
          python3 scripts/build_water_ocean_wave1_review.py
      - name: Verify licenses, provenance, 30 old production IDs, 45 original presets
        run: |
          node scripts/test_water_ocean_wave1_review.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_library_foundation.cjs
      - name: Responsive browser QA, all three tracks, seek and feedback
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/water-ocean-review-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_water_ocean_wave1_browser.cjs
      - name: Commit only review MP3 and manifest if QA PASS
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signature/water-ocean-wave1-review/
          if git diff --cached --quiet; then echo "No new review assets"; exit 0; fi
          git commit -m "Water Ocean Wave1: three CC0 audition MP3s after technical QA"
          git push origin "HEAD:${BRANCH}"
