name: Player Loop and Sleep Timer Smoke Tests
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'index.html'
      - 'assets/persistent-router.js'
      - 'assets/persistent.css'
      - 'assets/library.css'
      - 'catalog/library.json'
      - 'sounds/**'
      - 'collections/**'
      - 'soundscapes/**'
      - 'audio-tools/**'
      - 'sitemap.xml'
      - 'scripts/test_library_structure.cjs'
      - 'loop-check.html'
      - 'scripts/test_loop_check.cjs'
      - 'scripts/test_player_smoke.cjs'
      - '.github/workflows/player_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run playback and timer tests on Node 22
        run: |
          node --version
          node scripts/test_player_smoke.cjs
          node scripts/test_loop_check.cjs
          node scripts/test_library_structure.cjs
