name: Player Loop and Sleep Timer Smoke Tests
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'index.html'
      - 'assets/persistent-router.js'
      - 'assets/persistent.css'
      - 'assets/library.css'
      - 'catalog/library.json'
      - 'catalog/family-registry.json'
      - 'catalog/planned-sounds.json'
      - 'catalog/mix-proposals.json'
      - 'sounds/**'
      - 'collections/**'
      - 'soundscapes/**'
      - 'audio-tools/**'
      - 'sitemap.xml'
      - 'scripts/test_library_structure.cjs'
      - 'scripts/build_sound_library_foundation.cjs'
      - 'scripts/test_library_foundation.cjs'
      - 'scripts/test_library_foundation_browser.cjs'
      - 'scripts/test_library_explorer_browser.cjs'
      - 'framework-preview/**'
      - 'scripts/test_relaxing_collection.cjs'
      - 'scripts/test_relaxing_browser.cjs'
      - 'scripts/test_sleep_collection.cjs'
      - 'scripts/test_sleep_browser.cjs'
      - 'scripts/test_baby_collection.cjs'
      - 'scripts/test_baby_browser.cjs'
      - 'scripts/test_field_sound_pages.cjs'
      - 'scripts/test_field_sound_browser.cjs'
      - 'scripts/test_noise_colors_editorial.cjs'
      - 'scripts/test_noise_colors_browser.cjs'
      - 'scripts/test_batch18_pages.cjs'
      - 'scripts/test_device_environment_editorial.cjs'
      - 'scripts/test_browser_navigation.cjs'
      - 'loop-check.html'
      - 'scripts/test_loop_check.cjs'
      - 'scripts/test_player_smoke.cjs'
      - '.github/workflows/player_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Run playback and timer tests on Node 22
        run: |
          node --version
          node scripts/test_player_smoke.cjs
          node scripts/test_loop_check.cjs
          node scripts/test_library_structure.cjs
          node scripts/build_sound_library_foundation.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_relaxing_collection.cjs
          node scripts/test_sleep_collection.cjs
          node scripts/test_baby_collection.cjs
          node scripts/test_field_sound_pages.cjs
          node scripts/test_noise_colors_editorial.cjs
          node scripts/test_batch18_pages.cjs
          node scripts/test_device_environment_editorial.cjs
      - name: Browser navigation & persistent playback regression
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/wnc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/test_browser_navigation.cjs
          node scripts/test_relaxing_browser.cjs
          node scripts/test_sleep_browser.cjs
          node scripts/test_baby_browser.cjs
          node scripts/test_field_sound_browser.cjs
          node scripts/test_noise_colors_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_library_explorer_browser.cjs
