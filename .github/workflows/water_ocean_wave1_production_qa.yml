name: Water Ocean Wave 1 Independent Production QA (33 Sources, Mobile)
on:
  push:
    branches: [main, "feature/water-ocean-wave1-production-20261109"]
    paths:
      - "audio/continuous/manifest.json"
      - "audio/continuous/rushing-river-real/**"
      - "audio/continuous/forest-stream-real/**"
      - "audio/continuous/gentle-ocean-real/**"
      - "catalog/library.json"
      - ".github/workflows/water_ocean_wave1_production_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-water-ocean-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg/ffprobe for HLS decoder verification
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Recheck 30 original MP3 and HLS hashes, three approved new masters, index-safe pages and 45 presets
        run: |
          node scripts/test_water_ocean_wave1_production.cjs
          node scripts/test_water_ocean_wave1_review.cjs
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/test_player_smoke.cjs
          python3 scripts/check_listening_queue.py
          python3 scripts/test_hls_transport.py
      - name: Independently test browser audio, 320/390 iPhone widths, existing player and review room
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/water-ocean-qa-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_water_ocean_wave1_production_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_water_ocean_wave1_browser.cjs
