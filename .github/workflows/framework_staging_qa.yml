name: Library Framework Staging QA
on:
  push:
    branches: [feature/library-framework-staging-20261110]
  pull_request:
    paths:
      - "framework-preview/**"
      - "scripts/test_framework_staging.cjs"
      - ".github/workflows/framework_staging_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Editorial staging validation
        run: node scripts/test_framework_staging.cjs
      - name: Existing library non-regression checks
        run: node scripts/test_library_foundation.cjs
      - name: Package offline preview without audio assets
        run: |
          mkdir -p artifact/framework-preview artifact/catalog
          cp framework-preview/index.html framework-preview/master-inventory.json artifact/framework-preview/
          cp catalog/library.json artifact/catalog/
          (cd artifact && zip -qr ../white-noise-library-framework-preview.zip .)
      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: white-noise-library-framework-preview
          path: white-noise-library-framework-preview.zip
          retention-days: 14
