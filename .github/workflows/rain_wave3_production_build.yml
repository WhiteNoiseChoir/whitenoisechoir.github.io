name: Rain Wave 3 Production HLS Builder (owner-approved only)
on:
  push:
    branches: ["feature/rain-wave3-production-20261109"]
    paths:
      - "scripts/build_rain_wave3_production_hls.py"
      - "scripts/test_library_foundation.cjs"
      - ".github/workflows/rain_wave3_production_build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-two-hls:
    if: github.ref_name == 'feature/rain-wave3-production-20261109' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure FFmpeg and ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Build only two approved 7-day HLS streams and regenerate sound browse index
        run: |
          python3 scripts/build_rain_wave3_production_hls.py
          node scripts/build_sound_library_foundation.cjs --write
      - name: Verify exact reviewed bytes, original 28 hashes, library and all SEO gates
        run: |
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_rain_wave3_review.cjs
          node scripts/test_rain_wave2_production.cjs
          node scripts/test_rain_production_release.cjs
          node scripts/test_rain_wave2_review.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/build_sound_library_foundation.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_batch18_pages.cjs
          node scripts/test_field_sound_pages.cjs
          node scripts/test_noise_colors_editorial.cjs
          node scripts/test_device_environment_editorial.cjs
          node scripts/test_rain_first_wave_review.cjs
          python3 scripts/check_listening_queue.py
          python3 scripts/test_rain_review_audio.py
      - name: Decode 30 HLS streams across end-of-master boundaries
        run: |
          python3 scripts/test_hls_transport.py
          python3 scripts/test_batch18_audio.py
      - name: Commit generated HLS only after all checks pass
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/index.html audio/continuous/manifest.json
          git add audio/continuous/rain-leaves-real/ audio/continuous/rain-lake-real/
          if git diff --cached --quiet; then echo "No new assets"; exit 0; fi
          git commit -m "Rain Wave3: QA-verified 7-day native HLS for 2 approved CC0 sources"
          git push origin "HEAD:${BRANCH}"
