name: Rain Wave2 Production Final QA
on:
  push:
    branches: [main, "feature/rain-wave2-production-20261109"]
    paths:
      - "audio/continuous/manifest.json"
      - "audio/continuous/rain-on-tent-real/**"
      - "audio/continuous/rain-car-roof-real/**"
      - "audio/continuous/rolling-thunder-real/**"
      - ".github/workflows/rain_wave2_production_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-audio-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 28 audio sources, first-wave lock, 45 presets and HLS boundaries
        run: |
          node scripts/test_rain_wave2_production.cjs
          node scripts/test_rain_production_release.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/test_player_smoke.cjs
          python3 scripts/test_hls_transport.py
      - name: Verify responsive widths, persistent playback and review page
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/wnc-wave2-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_rain_production_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_rain_wave2_browser.cjs
