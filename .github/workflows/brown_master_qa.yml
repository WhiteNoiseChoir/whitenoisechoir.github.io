name: Brown Noise Master Audio QA
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'audio/brown-noise.mp3'
      - 'audio/color-master-manifest.json'
      - 'audio/continuous/brown-noise/**'
      - 'sounds/brown-noise/**'
      - 'scripts/test_brown_master.py'
      - '.github/workflows/brown_master_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brown-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Brown Noise production MP3, waveform and HLS
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy
          python3 scripts/test_brown_master.py
