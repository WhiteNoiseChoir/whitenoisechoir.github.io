name: Build Approved Rain and Fireplace Long Masters (QA Gate)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_production_masters.py'
      - '.github/workflows/production_masters.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whitenoisechoir-long-masters
  cancel-in-progress: false
jobs:
  build-long-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved Signature masters
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio codecs and numerical DSP
        run: |
          python -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Syntax check long-master builder
        run: python -m py_compile scripts/build_production_masters.py
      - name: Build and QA exactly 2 long-form real-recording tracks
        run: python -u scripts/build_production_masters.py
      - name: Verify duration, provenance, checksum and technical pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          manifest=json.loads(Path('audio/master-manifest.json').read_text(encoding='utf-8'))
          tracks=manifest['masters']
          assert {r['id'] for r in tracks}=={'rain-on-window-real','fireplace-real'}
          assert manifest['long_master_human_approved'] is False
          for row in tracks:
              p=Path(row['file'])
              assert p.is_file() and p.stat().st_size>10_000_000,(p,row)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['file_sha256'],row['id']
              qa=row['technical_qa']
              assert qa['technical_status']=='PASS',qa
              assert not qa['flags'],qa
              assert 599.8<=qa['duration_seconds']<=600.2,qa
              assert qa['crest_factor_db']<=25,qa
              assert qa['true_peak_dbtp']<=-1.5,qa
              assert qa['loop_boundary_jump_vs_typical_adjacent_diff']<=6,qa
          print('QA gate passed: two ten-minute MP3s, hashes and independent recording provenance verified.')
          PY
      - name: Publish only two MP3s and their auditable manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/rain-on-window-real.mp3 audio/fireplace-real.mp3 audio/master-manifest.json
          if git diff --cached --quiet; then
            echo "Same deterministic master files already committed"
          else
            git commit -m "Publish two 10-minute real ambience masters after QA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
