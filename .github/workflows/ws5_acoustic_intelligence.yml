name: WS5 Acoustic Intelligence — bounded R2 audio analysis
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ws5_acoustic_intelligence.py'
      - 'scripts/test_ws5_acoustic_intelligence.py'
      - '.github/workflows/ws5_acoustic_intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ws5_acoustic_intelligence.py'
      - '.github/workflows/ws5_acoustic_intelligence.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: wnc-ws5-acoustic-r2
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python -m pip install -q 'numpy>=1.26,<3'
      - name: Validate SHA and wave acoustic measurements
        run: python -m unittest discover -s scripts -p 'test_ws5_acoustic_intelligence.py' -v
  analyze-real-r2:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'feat(ws5): activate'))) &&
      github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg (ffprobe) and Python dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y ffmpeg
          python -m pip install -q 'boto3>=1.36,<2' 'numpy>=1.26,<3'
      - name: Analyze up to 24 real R2 files; never overwrite audio
        run: python -u scripts/ws5_acoustic_intelligence.py --max-files 24 --max-scan 50
      # Private R2 metrics only. No artifacts or GitHub PR comments with raw file data.
