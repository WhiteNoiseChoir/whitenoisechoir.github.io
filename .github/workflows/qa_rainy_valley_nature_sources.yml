name: WNC Rainy Valley Nature Source QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa_rainy_valley_nature_sources.py'
      - '.github/workflows/qa_rainy_valley_nature_sources.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -u scripts/qa_rainy_valley_nature_sources.py
