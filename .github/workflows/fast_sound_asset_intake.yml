name: Fast Sound Asset Intake QA
on:
  pull_request:
    paths:
      - "scripts/fast_sound_asset_intake.py"
      - "scripts/test_fast_sound_asset_intake.py"
      - "catalog/sound-asset-library-v1.json"
      - ".github/workflows/fast_sound_asset_intake.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fast_sound_asset_intake.py"
      - "scripts/test_fast_sound_asset_intake.py"
      - "catalog/sound-asset-library-v1.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-fast-bulk-import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe (read-only audio metadata validation)
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Syntax and generated audio fixture regression
        run: |
          python3 -m py_compile scripts/fast_sound_asset_intake.py scripts/test_fast_sound_asset_intake.py
          python3 scripts/test_fast_sound_asset_intake.py
          node scripts/test_sound_asset_mixer_foundation.cjs
