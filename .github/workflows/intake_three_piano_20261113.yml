name: One-off Licensed Piano Trio R2 Intake
on:
  push:
    branches:
      - intake/three-piano-20261113
    paths:
      - scripts/intake_three_piano_20261113.py
      - .github/workflows/intake_three_piano_20261113.yml
permissions:
  contents: read
concurrency:
  group: onetime-piano-intake-20261113
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client and FFmpeg
        run: |
          python -m pip install -q 'boto3>=1.36,<2'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Discover official downloads, validate audio, and upload to R2 asset library
        run: python -u scripts/intake_three_piano_20261113.py
      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-piano-r2-import-report-20261113
          path: three-piano-r2-import-report.json
          retention-days: 30
          if-no-files-found: warn
