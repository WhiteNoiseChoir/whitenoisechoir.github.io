name: Rain Wave2 Review QA — media and mobile checks
on:
  push:
    branches: [main, "feature/rain-wave2-qa-20261108"]
    paths:
      - "signature/rain-wave2-review/**"
      - "scripts/test_rain_wave2_review.cjs"
      - "scripts/test_rain_wave2_browser.cjs"
      - ".github/workflows/rain_wave2_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Verify three real CC0 review assets, owner hold and existing 25-source player
        run: |
          node scripts/test_rain_wave2_review.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_player_smoke.cjs
      - name: Verify mobile 320/390, actual 10-minute audio metadata, seek and saved review
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/wnc-rainwave2-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_rain_wave2_browser.cjs
