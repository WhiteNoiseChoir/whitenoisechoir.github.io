name: WNC Studio Intent Audio v1 — Branch QA
on:
  push:
    branches: [feature/studio-intents-frequency-baby-20261116]
    paths:
      - 'studio-engine.js'
      - 'studio-ui.js'
      - 'studio.css'
      - 'index.html'
      - 'vi/**/index.html'
      - 'scripts/build_studio_routes.cjs'
      - 'scripts/test_studio_intent_frequency_v1.cjs'
      - 'scripts/test_studio_intent_browser.mjs'
      - 'scripts/ws5_acoustic_intelligence.py'
      - 'scripts/sync_r2_ai_index_private_github.py'
      - 'scripts/test_ws5_acoustic_intelligence.py'
      - 'scripts/test_r2_ai_index_private_bridge.py'
      - '.github/workflows/qa_studio_intent_audio_v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'studio-engine.js'
      - 'studio-ui.js'
      - 'scripts/test_studio_intent_frequency_v1.cjs'
      - 'scripts/ws5_acoustic_intelligence.py'
      - 'scripts/sync_r2_ai_index_private_github.py'
      - 'scripts/test_ws5_acoustic_intelligence.py'
      - 'scripts/test_r2_ai_index_private_bridge.py'
permissions:
  contents: read
jobs:
  studio-and-private-metadata-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript parse and Studio signal/identity regression
        run: |
          node --check studio-engine.js
          node --check studio-ui.js
          node --check scripts/build_studio_routes.cjs
          node scripts/test_studio_intent_frequency_v1.cjs
      - name: Install headless browser test harness
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund 'playwright-core@1.57.0'
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No browser executable found"; exit 1
          fi
      - name: Headless Studio interaction, JSON roundtrip and WAV QA
        run: node scripts/test_studio_intent_browser.mjs
      - name: Install offline analysis dependencies
        run: python -m pip install -q 'numpy>=1.26,<3' 'boto3>=1.36,<2' 'requests>=2.32,<3'
      - name: Validate private intent metadata and sampled acoustic features
        run: |
          python -m unittest discover -s scripts -p 'test_ws5_acoustic_intelligence.py' -v
          python -m unittest discover -s scripts -p 'test_r2_ai_index_private_bridge.py' -v
      # No R2 secrets, real metadata rows, audio transfers, or production changes.
