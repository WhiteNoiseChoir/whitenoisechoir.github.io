name: Publish encrypted Studio asset catalog
on:
  push:
    branches: [main, feature/unified-studio-library]
    paths:
      - 'scripts/build_studio_asset_catalog.py'
      - 'data/studio-catalog-public-key.json'
      - '.github/workflows/studio_asset_catalog.yml'
  schedule:
    - cron: '35 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whitenoisechoir-encrypted-studio-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'boto3>=1.36,<2' 'cryptography>=44,<47'
      - name: Read current R2 inventory and publish only the encrypted catalog
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STUDIO_STATE_BUCKET: ${{ vars.STUDIO_STATE_BUCKET }}
        run: python scripts/build_studio_asset_catalog.py
