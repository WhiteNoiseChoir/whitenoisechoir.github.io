name: C6 P0 Queue and Locked Review Gate
on:
  pull_request:
    paths:
      - "catalog/sound-production-queue-c6.json"
      - "framework-preview/c6-listening/**"
      - "scripts/test_sound_production_queue_c6.cjs"
      - "scripts/test_sound_production_queue_browser_c6.cjs"
      - ".github/workflows/c6-p0-queue.yml"
      - "catalog/sound-production-registry-c5.json"
      - "catalog/library.json"
  push:
    branches: [main]
    paths:
      - "catalog/sound-production-queue-c6.json"
      - "framework-preview/c6-listening/**"
      - "scripts/test_sound_production_queue_c6.cjs"
      - ".github/workflows/c6-p0-queue.yml"
permissions:
  contents: read
jobs:
  c6-queue-and-listening-room:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all ten candidates, source gates, JS and SEO non-regression
        run: node scripts/test_sound_production_queue_c6.cjs
      - name: Browser/mobile smoke test (no C6 audio unlocked)
        run: |
          npm install --no-save playwright@1.55.0
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/wnc-c6-http.log 2>&1 &
          sleep 2
          node scripts/test_sound_production_queue_browser_c6.cjs
      - name: Revalidate legacy C5 release registry
        run: node scripts/test_sound_production_registry_c5.cjs
