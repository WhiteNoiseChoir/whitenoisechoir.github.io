name: Water Ocean Wave2 Production Independent QA (35 Sources)
on:
  push:
    branches: [main, "feature/water-ocean-wave2-production-20261109"]
    paths:
      - "audio/continuous/manifest.json"
      - "audio/continuous/bodetal-brook-real/**"
      - "audio/continuous/crashing-ocean-real/**"
      - "catalog/library.json"
      - ".github/workflows/water_ocean_wave2_production_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-35-hls-owner-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Verify exact owner-reviewed masters and original 33 protected SHA-256
        run: |
          node scripts/test_water_ocean_wave2_production.cjs
          node scripts/test_water_ocean_wave2_review.cjs
          node scripts/test_water_ocean_wave2_integrity.cjs
          node scripts/test_water_ocean_wave1_production.cjs
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_rain_production_release.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/test_player_smoke.cjs
          python3 scripts/check_listening_queue.py
      - name: Independently decode all 35 HLS cycle boundaries
        run: |
          python3 scripts/test_hls_transport.py
      - name: Verify no autoplay and mobile layouts at 320 and 390 pixels
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/water-ocean-wave2-independent.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_water_ocean_wave2_production_browser.cjs
          node scripts/test_water_ocean_wave1_production_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_water_ocean_wave2_browser.cjs
