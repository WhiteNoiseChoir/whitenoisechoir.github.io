name: Rain Wave 3 Audition QA (No Production Changes)
on:
  push:
    branches: [main, "feature/rain-wave3-review-20261109"]
    paths:
      - "signature/rain-wave3-review/**"
      - "scripts/test_rain_wave3_review.cjs"
      - "scripts/test_rain_wave3_browser.cjs"
      - ".github/workflows/rain_wave3_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave3-review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe if necessary
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Confirm two approved-license review assets and no change to 28 production sound IDs or 45 presets
        run: |
          node scripts/test_rain_wave3_review.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
      - name: Confirm 320 / 390 mobile, no autoplay, 9:55 seek and owner review storage
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/rain-wave3-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_rain_wave3_browser.cjs
