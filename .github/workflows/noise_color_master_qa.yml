name: Noise Colors Master Quality Gate
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'audio/white-noise.mp3'
      - 'audio/pink-noise.mp3'
      - 'audio/brown-noise.mp3'
      - 'audio/green-noise.mp3'
      - 'audio/green-noise-master-manifest.json'
      - 'audio/continuous/green-noise/**'
      - 'scripts/test_green_noise.py'
      - 'audio/color-master-manifest.json'
      - 'audio/continuous/white-noise/**'
      - 'audio/continuous/pink-noise/**'
      - 'audio/continuous/brown-noise/**'
      - 'sounds/pink-noise/**'
      - 'sounds/white-noise/**'
      - 'scripts/test_noise_color_master.py'
      - '.github/workflows/noise_color_master_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  noise-color-master-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify original Pink, White and Brown MP3 masters and native HLS boundary
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python3 -m pip install --disable-pip-version-check --quiet numpy
          python3 scripts/test_noise_color_master.py pink-noise white-noise brown-noise
          python3 scripts/test_green_noise.py
