name: WNC Ocean Secret Sanctuary — CC0 Source Intake
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest_ocean_secret_sanctuary_cc0_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wnc-ocean-cave-source-intake
  cancel-in-progress: false
jobs:
  scoped-cc0-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe importer dependencies
        run: |
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'py7zr>=0.21,<1'
          command -v ffprobe >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Import only CC0 original sea-cave water / ocean waves files in small bounded batch
        run: |
          python -u scripts/harvest_opengameart_cc0_to_r2.py \
            --seed-page dripping-water-loop \
            --seed-page beach-ocean-waves \
            --max-workers 2 \
            --max-pages 2 \
            --max-files 8 \
            --max-total-mb 45 \
            --report audits/ocean-secret-sanctuary-cc0-20261117.json
      - name: Save concrete provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocean-secret-sanctuary-cc0-report
          path: audits/ocean-secret-sanctuary-cc0-20261117.json
          if-no-files-found: warn
          retention-days: 30
