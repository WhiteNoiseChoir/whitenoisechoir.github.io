name: Rain Thunder Wave2 CC0 Preview Auditions
on:
  push:
    branches: ["feature/rain-wave2-qa-20261108"]
    paths:
      - "scripts/build_rain_wave2_review.py"
      - "scripts/test_rain_wave2_review.cjs"
      - ".github/workflows/rain_wave2_build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-three-review-only:
    if: github.ref_name == 'feature/rain-wave2-qa-20261108' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg where necessary
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Render three real CC0 field-source auditions (not production)
        run: |
          python3 -m py_compile scripts/build_rain_wave2_review.py
          python3 scripts/build_rain_wave2_review.py
      - name: Actual media integrity, CC0 attribution, mono source and noindex gate
        run: |
          node scripts/test_rain_wave2_review.cjs
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib
          p=pathlib.Path("signature/rain-wave2-review")
          obj=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          assert obj["status"]=="REVIEW_ONLY_PENDING_OWNER"
          for r in obj["tracks"]:
              q=p/(r["id"]+".mp3")
              assert q.is_file() and q.stat().st_size>13_000_000
              assert hashlib.sha256(q.read_bytes()).hexdigest()==r["master_sha256"]
              y=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_name,channels,sample_rate","-of","json",str(q)],check=True,capture_output=True,text=True)
              m=json.loads(y.stdout)
              assert 599<=float(m["format"]["duration"])<=601
              assert any(s.get("codec_name")=="mp3" and s.get("channels")==2 and int(s.get("sample_rate",0))==44100 for s in m["streams"])
              print("WAVE2_AUDIO_QA",r["id"],r["master_sha256"],flush=True)
          print("WAVE2_NO_PRODUCTION_WRITES_PASS",flush=True)
          PY
      - name: Commit three independent review files and manifest to feature branch only
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signature/rain-wave2-review/rain-on-tent-review.mp3 signature/rain-wave2-review/rain-car-roof-review.mp3 signature/rain-wave2-review/rolling-thunder-review.mp3 signature/rain-wave2-review/manifest.json
          if git diff --cached --quiet; then echo "Wave2 review assets already generated"; exit 0; fi
          git commit -m "Audio review-only: three CC0 rain and thunder wave2 10min auditions"
          git push origin "HEAD:${BRANCH}"
