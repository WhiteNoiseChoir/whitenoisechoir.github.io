name: Studio Private Music Opt-in — isolated CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'studio-private-music-optin.mjs'
      - 'studio-engine.js'
      - 'studio-ui.js'
      - 'vi/index.html'
      - 'test/studio-private-music-optin.test.mjs'
      - '.github/workflows/studio_private_music_optin_qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-music-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate optional Music loader without external Access
        run: node --test test/studio-private-music-optin.test.mjs
      - name: Validate Studio JavaScript parses
        run: |
          node --check studio-engine.js
          node --check studio-ui.js
          node --check studio-private-music-optin.mjs
      - name: Verify explicit opt-in and no automatic catalog request
        run: |
          grep -Fq 'private-music' studio-ui.js
          grep -Fq "get('private-music') === '1'" studio-ui.js
          grep -Fq "wnc-private-music-gateway.whitescreen-dev.workers.dev" studio-engine.js
      - name: Prevent automatic activation in site HTML
        run: |
          if grep -R --include="*.html" -l 'studio-private-music-optin.mjs' vi index.html; then
            echo "SECURITY: Unapproved live module activation" >&2
            exit 2
          fi
          echo "STUDIO_PRIVATE_MUSIC_MODE=NOT_LOADED_IN_PRODUCTION"
