name: Rain Wave 3 Production Independent QA (30 Sources, Mobile)
on:
  push:
    branches: [main, "feature/rain-wave3-production-20261109"]
    paths:
      - "audio/continuous/manifest.json"
      - "audio/continuous/rain-leaves-real/**"
      - "audio/continuous/rain-lake-real/**"
      - ".github/workflows/rain_wave3_production_qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave3-production-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg and ffprobe are available for audio decoder QA
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Independent production audio, checksum, original-28 lock and 45 preset checks
        run: |
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_rain_wave2_production.cjs
          node scripts/test_rain_production_release.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/test_player_smoke.cjs
          python3 scripts/check_listening_queue.py
          python3 scripts/test_hls_transport.py
      - name: Mobile widths 320px and 390px, native player fallback, browse, seek and review room
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/rain-wave3-production-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_rain_production_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_rain_wave3_browser.cjs
