name: Balanced R2 HLS Prune - immutable SHA, native fallback and mobile QA

on:
  push:
    branches:
      - feature/r2-balanced-hls-prune-20261109
      - main
    paths:
      - 'listen.html'
      - 'audio/continuous/**'
      - 'audits/r2-hls-immutable-source-inventory.json'
      - 'scripts/rehydrate_r2_hls_ci.py'
      - 'scripts/test_r2_balanced_layout.cjs'
      - 'scripts/test_r2_player_browser.cjs'
      - 'scripts/test_player_smoke.cjs'
      - 'scripts/test_media_dedup.cjs'
      - '.github/workflows/r2_balanced_hls_prune_qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validated-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout production source tree without mutation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit 8 GH HLS backups, 27 R2-only HLS, 35 SHA-approved MP3 and sound pages
        run: |
          node scripts/test_r2_balanced_layout.cjs
          node scripts/audit_r2_storage_budget.cjs
          node scripts/test_media_dedup.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_library_structure.cjs
          node scripts/test_field_sound_pages.cjs
          node scripts/test_noise_colors_editorial.cjs
      - name: Independently verify and restore approved R2 HLS bytes in ephemeral CI
        run: python3 scripts/rehydrate_r2_hls_ci.py
      - name: Install ffmpeg for 35 original HLS decoder tests
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Run 35 native HLS boundaries and historical owner approved source audits
        run: |
          python3 scripts/test_hls_transport.py
          node scripts/test_rain_production_release.cjs
          node scripts/test_rain_wave2_production.cjs
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_water_ocean_wave1_production.cjs
          node scripts/test_water_ocean_wave2_production.cjs
          node scripts/test_r2_transport_room.cjs
      - name: Browser tests for R2 outages and GH fallback routes
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs > /tmp/wnc-r2-prune-http.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_r2_player_browser.cjs
      - name: Assert ephemeral hydration did not change any tracked production files
        run: |
          git diff --exit-code
          echo 'Pruned R2 objects are rehydrated only in the CI workspace, never committed.'
