name: R2 Balanced HLS Legacy Dependency Discovery
on:
  push:
    branches: [feature/r2-balanced-hls-prune-20261109]
    paths: ['.github/workflows/r2_prune_dependency_scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan content, tests and workflows for physical HLS reads
        shell: bash
        run: |
          echo 'HLS_REFS_START'
          grep -nRE 'sha\(.*playlist|part_000|part_[0-9]|readFileSync\(.*continuous|existsSync\(.*continuous|test_hls_transport|\.m3u8|audio/continuous' --include='*.cjs' --include='*.py' --include='*.yml' --include='*.js' scripts .github/workflows 2>/dev/null | sed -n '1,280p'
          echo 'HLS_REFS_END'
          echo 'FOOTER_CONTENTS'
          git ls-files audio/continuous | wc -l
