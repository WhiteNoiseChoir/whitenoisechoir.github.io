name: Water Ocean Wave2 Production HLS Builder (Owner Approved)
on:
  push:
    branches: ["feature/water-ocean-wave2-production-20261109"]
    paths:
      - "scripts/build_water_ocean_wave2_production_hls.py"
      - "scripts/test_water_ocean_wave2_production.cjs"
      - ".github/workflows/water_ocean_wave2_production_build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release-two-approved-water-ocean-hls:
    if: github.ref_name == 'feature/water-ocean-wave2-production-20261109' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure FFmpeg/ffprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Build only 2 approved HLS playlists and generated library browse
        run: |
          python3 -m py_compile scripts/build_water_ocean_wave2_production_hls.py
          python3 scripts/build_water_ocean_wave2_production_hls.py
          node scripts/build_sound_library_foundation.cjs --write
      - name: Audit exact master bytes, all old 33 sound and HLS checksums, indexed SEO and 45 presets
        run: |
          node scripts/test_water_ocean_wave2_production.cjs
          node scripts/test_water_ocean_wave2_review.cjs
          node scripts/test_water_ocean_wave2_integrity.cjs
          node scripts/test_water_ocean_wave1_production.cjs
          node scripts/test_water_ocean_wave1_review.cjs
          node scripts/test_rain_wave3_production.cjs
          node scripts/test_rain_wave3_review.cjs
          node scripts/test_rain_wave2_production.cjs
          node scripts/test_rain_production_release.cjs
          node scripts/test_rain_wave2_review.cjs
          node scripts/test_rain_first_wave_review.cjs
          node scripts/test_library_foundation.cjs
          node scripts/test_library_structure.cjs
          node scripts/build_sound_library_foundation.cjs
          node scripts/test_player_smoke.cjs
          node scripts/test_batch18_pages.cjs
          node scripts/test_field_sound_pages.cjs
          node scripts/test_noise_colors_editorial.cjs
          node scripts/test_device_environment_editorial.cjs
          python3 scripts/check_listening_queue.py
          python3 scripts/test_rain_review_audio.py
      - name: Decode 35 HLS streams through source-cycle boundaries, audit all 18 original masters
        run: |
          python3 scripts/test_hls_transport.py
          python3 scripts/test_batch18_audio.py
      - name: Browser: 35 sound catalog, two new players, original player, mobile and reviews
        run: |
          npm install --no-save --no-package-lock playwright
          node scripts/rain_review_range_test_server.cjs >/tmp/water-ocean-wave2-production-server.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          node scripts/test_water_ocean_wave2_production_browser.cjs
          node scripts/test_water_ocean_wave1_production_browser.cjs
          node scripts/test_rain_production_browser.cjs
          node scripts/test_library_foundation_browser.cjs
          node scripts/test_water_ocean_wave2_browser.cjs
      - name: Commit only two new HLS and regenerated browse after QA success
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sounds/index.html audio/continuous/manifest.json
          git add audio/continuous/bodetal-brook-real/ audio/continuous/crashing-ocean-real/
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git commit -m "Water Ocean Wave2: 2 owner-approved 7-day HLS after all QA gates"
          git push origin "HEAD:${BRANCH}"
