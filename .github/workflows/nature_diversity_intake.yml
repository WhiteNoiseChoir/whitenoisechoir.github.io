name: Diverse Open Nature Recordings
on:
  push:
    branches:
      - feature/diverse-nature-audio-20261111
    paths:
      - 'scripts/harvest_nature_diversity_to_r2.py'
      - '.github/workflows/nature_diversity_intake.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nature-diversity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    name: Collect originals from ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        source: [commons, forest, nps]
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install intake dependencies
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m pip install -q 'boto3>=1.36,<2' 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Collect and verify R2 objects
        env:
          INTAKE_SOURCE: ${{ matrix.source }}
        run: python -u scripts/harvest_nature_diversity_to_r2.py --source "$INTAKE_SOURCE"
      - name: Count actual distinct R2 assets
        if: always()
        run: python -u scripts/audit_r2_asset_inventory.py
